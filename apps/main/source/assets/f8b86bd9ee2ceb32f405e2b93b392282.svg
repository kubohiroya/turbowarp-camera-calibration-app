<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360"><rect width="480" height="360" fill="#152033"/><text x="28" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e8f0ff">Camera Calibration</text><text x="28" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8fb6ff">v0.1.0</text><text x="28" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8fb6ff">© 2026 Hiroya Kubo · MPL-2.0</text><text x="28" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#e8f0ff">カメラのレンズの歪みを測り、</text><text x="28" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#e8f0ff">校正プロファイルを作ります。</text><text x="28" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8fb6ff">ChArUco ボードが要ります。この端末に表示するか、</text><text x="28" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8fb6ff">印刷した紙を用意してください。</text><text x="28" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8fb6ff">ボードを表示（数字は横×縦のマスの数）</text><text x="28" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8fb6ff">校正を始める</text><text x="340" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8fb6ff">プロファイルを使う</text></svg>
