name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Kept out of `pnpm check` because it starts a browser, which is the only
      # place OpenCV can be asked anything: it registers its API through embind
      # when the WebAssembly module initializes, and does not finish
      # initializing under Node.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run board:check
